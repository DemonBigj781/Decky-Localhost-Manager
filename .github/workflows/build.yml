name: Build Decky Plugin

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Validate Python syntax
        run: python3 -m py_compile main.py

      - name: Package Decky plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/Decky-Localhost-Manager
          cp plugin.json main.py release/Decky-Localhost-Manager/
          cp -r dist release/Decky-Localhost-Manager/
          if [[ -f README.md ]]; then cp README.md release/Decky-Localhost-Manager/; fi
          cd release
          zip -r ../Decky-Localhost-Manager.zip Decky-Localhost-Manager

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Decky-Localhost-Manager
          path: Decky-Localhost-Manager.zip
          if-no-files-found: error
